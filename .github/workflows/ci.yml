name: AI Document Assistant CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgrtes:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: ai_document_db
          POSTGRES_USER: ai_document_user
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ai_document_user -d ai_document_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ai_document_db
          SPRING_DATASOURCE_USERNAME: ai_document_user
          DB_PASSWORD: test_password
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-only-123456789
          OPENAI_API_KEY: test-openai-key
        run: ./mvnw test

      - name: Build Docker image
        run: docker build -t sajjanadi55/ai-document-assistant:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push sajjanadi55/ai-document-assistant:${{ github.sha }}