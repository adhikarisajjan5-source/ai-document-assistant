<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Document Assistant</title>

    <link rel="stylesheet"
          href="/css/style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <h1>AI Document Assistant</h1>

        <p class="subtitle">
            Secure local PDF question answering
        </p>


        <!-- LOGIN -->

        <div class="auth-section">

            <h2>Login</h2>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                        id="loginEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                        id="loginPassword"
                        type="password"
                        placeholder="Password"
                        required
                >


                <button
                        type="submit"
                        class="primary-button">

                    Login

                </button>

            </form>

        </div>


        <div class="divider">

            <span>OR</span>

        </div>


        <!-- REGISTER -->

        <div class="auth-section">

            <h2>Create Account</h2>

            <form id="registerForm">

                <label for="registerEmail">
                    Email
                </label>

                <input
                        id="registerEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                >


                <label for="registerPassword">
                    Password
                </label>

                <input
                        id="registerPassword"
                        type="password"
                        minlength="8"
                        placeholder="Minimum 8 characters"
                        required
                >


                <button
                        type="submit"
                        class="secondary-button">

                    Register

                </button>

            </form>

        </div>


        <div
                id="authMessage"
                class="message">
        </div>

    </div>

</div>


<script src="/js/auth.js"></script>

</body>
</html>
